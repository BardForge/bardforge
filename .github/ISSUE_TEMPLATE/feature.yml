name: 'Новая функция'
description: 'Пользовательская задача и предлагаемая возможность.'
title: '[Feature] '
labels:
  - 'type:feature'
body:
  - type: 'markdown'
    attributes:
      value: 'Проверьте существующие Issues. Уязвимости направляйте через раздел Security и SECURITY.md; не публикуйте детали эксплуатации. Не добавляйте секреты, локальные пути, внутренние спецификации, агентские материалы, пользовательское аудио или приватные AI-промпты.'
  - type: 'dropdown'
    id: 'area'
    attributes:
      label: 'Область'
      description: 'Выберите наиболее близкую область; окончательные метки назначит сопровождающий.'
      options:
        - 'area:core'
        - 'area:desktop'
        - 'area:audio-engine'
        - 'area:mixer'
        - 'area:tracks'
        - 'area:scenes'
        - 'area:presets'
        - 'area:foundry'
        - 'area:network'
        - 'area:ui'
        - 'area:plugins'
        - 'area:ai'
        - 'area:voice'
        - 'area:music'
        - 'area:ci'
        - 'area:docs'
    validations:
      required: true
  - type: 'dropdown'
    id: 'priority'
    attributes:
      label: 'Предлагаемый приоритет'
      description: 'Приоритет подтверждает сопровождающий. P0 — критический инцидент; P1 — серьёзный блокер; P2 — плановая работа; P3 — небольшое улучшение.'
      options:
        - 'P0'
        - 'P1'
        - 'P2'
        - 'P3'
      default: 2
    validations:
      required: true
  - type: 'textarea'
    id: 'problem'
    attributes:
      label: 'Пользовательская задача'
      description: 'Кому и в каком игровом сценарии не хватает возможности?'
    validations:
      required: true
  - type: 'textarea'
    id: 'proposal'
    attributes:
      label: 'Предложение'
      description: 'Опишите желаемое поведение на конкретном примере.'
    validations:
      required: true
  - type: 'textarea'
    id: 'acceptance'
    attributes:
      label: 'Критерии готовности'
      description: 'Наблюдаемые условия, по которым можно проверить результат.'
    validations:
      required: true
  - type: 'textarea'
    id: 'alternatives'
    attributes:
      label: 'Альтернативы и границы'
      description: 'Как решаете задачу сейчас? Что можно исключить из первой версии?'
    validations:
      required: false
  - type: 'textarea'
    id: 'dependencies'
    attributes:
      label: 'Зависимости и ограничения'
      description: 'Нужны ли сеть, внешняя служба, права на материалы или новая интеграция? SDK, AI и голос пока являются направлениями работы, а Foundry — экспериментом.'
    validations:
      required: false
  - type: 'checkboxes'
    id: 'checklist'
    attributes:
      label: 'Проверка перед отправкой'
      options:
        - label: 'Я проверил существующие задачи и описал отличие от похожих сообщений.'
          required: true
        - label: 'В сообщении нет секретов, приватных данных и материалов; подозрение на уязвимость направляю по SECURITY.md.'
          required: true
