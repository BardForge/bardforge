name: 'Исследование'
description: 'Проверить гипотезу и подготовить решение на основе фактов.'
title: '[Research] '
labels:
  - 'type:research'
body:
  - type: 'markdown'
    attributes:
      value: 'Проверьте существующие Issues. Уязвимости направляйте через раздел Security и SECURITY.md; не публикуйте детали эксплуатации. Не добавляйте секреты, локальные пути, внутренние спецификации, агентские материалы, пользовательское аудио или приватные AI-промпты.'
  - type: 'dropdown'
    id: 'area'
    attributes:
      label: 'Область'
      description: 'Выберите наиболее близкую область; окончательные метки назначит сопровождающий.'
      options:
        - 'area:core'
        - 'area:desktop'
        - 'area:audio-engine'
        - 'area:mixer'
        - 'area:tracks'
        - 'area:scenes'
        - 'area:presets'
        - 'area:foundry'
        - 'area:network'
        - 'area:ui'
        - 'area:plugins'
        - 'area:ai'
        - 'area:voice'
        - 'area:music'
        - 'area:ci'
        - 'area:docs'
    validations:
      required: true
  - type: 'dropdown'
    id: 'priority'
    attributes:
      label: 'Предлагаемый приоритет'
      description: 'Приоритет подтверждает сопровождающий. P0 — критический инцидент; P1 — серьёзный блокер; P2 — плановая работа; P3 — небольшое улучшение.'
      options:
        - 'P0'
        - 'P1'
        - 'P2'
        - 'P3'
      default: 2
    validations:
      required: true
  - type: 'textarea'
    id: 'question'
    attributes:
      label: 'Исследовательский вопрос'
      description: 'Какую неопределённость нужно устранить и какое решение зависит от ответа?'
    validations:
      required: true
  - type: 'textarea'
    id: 'hypothesis'
    attributes:
      label: 'Гипотеза и исходные сведения'
      description: 'Отделите подтверждённые факты от предположений. Приведите публичные источники, если есть.'
    validations:
      required: true
  - type: 'textarea'
    id: 'method'
    attributes:
      label: 'Метод и границы'
      description: 'Как проверить гипотезу, какие ресурсы нужны и что остаётся вне исследования? Не предлагайте проверки чужой среды без разрешения.'
    validations:
      required: true
  - type: 'textarea'
    id: 'deliverable'
    attributes:
      label: 'Результат и критерий завершения'
      description: 'Например, сравнительная таблица, воспроизводимый эксперимент или рекомендация с ограничениями. Исследование не означает обещания реализации.'
    validations:
      required: true
  - type: 'textarea'
    id: 'risks'
    attributes:
      label: 'Риски и права на материалы'
      description: 'Зависимости, лицензии, конфиденциальность и ограничения измерений.'
    validations:
      required: false
  - type: 'textarea'
    id: 'dependencies'
    attributes:
      label: 'Зависимости'
      description: 'Связанные задачи, компоненты, доступная тестовая среда и другие необходимые условия. Оставьте пустым, если зависимостей нет.'
    validations:
      required: false
  - type: 'checkboxes'
    id: 'checklist'
    attributes:
      label: 'Проверка перед отправкой'
      options:
        - label: 'Я проверил существующие задачи и описал отличие от похожих сообщений.'
          required: true
        - label: 'В сообщении нет секретов, приватных данных и материалов; подозрение на уязвимость направляю по SECURITY.md.'
          required: true
