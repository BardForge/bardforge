name: 'Техническое улучшение'
description: 'Производительность, надёжность, сопровождаемость или устройство кода.'
title: '[Improvement] '
labels:
  - 'type:improvement'
body:
  - type: 'markdown'
    attributes:
      value: 'Проверьте существующие Issues. Уязвимости направляйте через раздел Security и SECURITY.md; не публикуйте детали эксплуатации. Не добавляйте секреты, локальные пути, внутренние спецификации, агентские материалы, пользовательское аудио или приватные AI-промпты.'
  - type: 'dropdown'
    id: 'area'
    attributes:
      label: 'Область'
      description: 'Выберите наиболее близкую область; окончательные метки назначит сопровождающий.'
      options:
        - 'area:core'
        - 'area:desktop'
        - 'area:audio-engine'
        - 'area:mixer'
        - 'area:tracks'
        - 'area:scenes'
        - 'area:presets'
        - 'area:foundry'
        - 'area:network'
        - 'area:ui'
        - 'area:plugins'
        - 'area:ai'
        - 'area:voice'
        - 'area:music'
        - 'area:ci'
        - 'area:docs'
    validations:
      required: true
  - type: 'dropdown'
    id: 'priority'
    attributes:
      label: 'Предлагаемый приоритет'
      description: 'Приоритет подтверждает сопровождающий. P0 — критический инцидент; P1 — серьёзный блокер; P2 — плановая работа; P3 — небольшое улучшение.'
      options:
        - 'P0'
        - 'P1'
        - 'P2'
        - 'P3'
      default: 2
    validations:
      required: true
  - type: 'textarea'
    id: 'current'
    attributes:
      label: 'Текущая проблема'
      description: 'Опишите измеряемую стоимость или конкретную трудность. Ссылки на публичный код допустимы.'
    validations:
      required: true
  - type: 'textarea'
    id: 'proposal'
    attributes:
      label: 'Предлагаемое изменение'
      description: 'Какие компоненты меняются и почему подход оправдан? Для чистого рефакторинга или обслуживания сопровождающий уточнит type-метку.'
    validations:
      required: true
  - type: 'textarea'
    id: 'verification'
    attributes:
      label: 'Как проверить улучшение'
      description: 'Метрика, воспроизводимый сценарий или проверка поведения. Разделяйте измеренные факты и предположения.'
    validations:
      required: true
  - type: 'textarea'
    id: 'compatibility'
    attributes:
      label: 'Совместимость и восстановление'
      description: 'Затрагиваются ли данные, API, зависимости или конфигурация? Как откатить изменение?'
    validations:
      required: true
  - type: 'textarea'
    id: 'alternatives'
    attributes:
      label: 'Альтернативы'
      description: 'Другие способы решить проблему и их недостатки.'
    validations:
      required: false
  - type: 'textarea'
    id: 'dependencies'
    attributes:
      label: 'Зависимости'
      description: 'Связанные задачи, компоненты, доступная тестовая среда и другие необходимые условия. Оставьте пустым, если зависимостей нет.'
    validations:
      required: false
  - type: 'checkboxes'
    id: 'checklist'
    attributes:
      label: 'Проверка перед отправкой'
      options:
        - label: 'Я проверил существующие задачи и описал отличие от похожих сообщений.'
          required: true
        - label: 'В сообщении нет секретов, приватных данных и материалов; подозрение на уязвимость направляю по SECURITY.md.'
          required: true
