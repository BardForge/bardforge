name: Manual stable Windows release

# Stable releases require an owner dispatch and a separate environment approval.
# No push, tag, pull_request, workflow_run, or reusable-workflow trigger.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable package version X.Y.Z already committed on main (without v)'
        type: string
        required: true
      qa_commit:
        description: 'Full 40-character main commit personally tested for this release'
        type: string
        required: true
      audio_qa_passed:
        description: 'I personally listened to the Windows build for qa_commit; audio QA passed'
        type: boolean
        required: true
        default: false
      foundry_qa_passed:
        description: 'I personally verified real remote-player Foundry audio for qa_commit'
        type: boolean
        required: true
        default: false
      qa_notes:
        description: 'QA evidence: date, tested build/commit, scenario and result; no credentials or personal data'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: manual-stable-release
  cancel-in-progress: false

jobs:
  verify-and-package:
    name: Verify immutable main and build Windows release
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      sums_sha256: ${{ steps.bundle.outputs.checksum_manifest_sha256 }}
    env:
      CI: 'true'
      RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      # Runs before checkout or dependency installation. Inputs are never shell source.
      - name: Reject non-owner dispatch, forks and non-main refs
        shell: pwsh
        run: |
          @'
          const assert = require('node:assert/strict');
          assert.equal(process.env.GITHUB_EVENT_NAME, 'workflow_dispatch');
          assert.equal(process.env.GITHUB_REF, 'refs/heads/main');
          assert.equal(process.env.GITHUB_REPOSITORY, 'BardForge/bardforge');
          assert.equal(process.env.GITHUB_ACTOR, 'ShinozakiAichi');
          assert.equal(process.env.GITHUB_TRIGGERING_ACTOR, 'ShinozakiAichi');
          assert.equal(process.env.GITHUB_SERVER_URL, 'https://github.com');
          assert.equal(process.env.RELEASE_WORKFLOW_SHA, process.env.GITHUB_SHA);
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # existing CI pin, v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # existing CI pin, v4
        with:
          node-version: 24
      - name: Validate stable version, lockfile, release notes and owner's QA declarations
        id: release
        run: node .github/release/validate.mjs
      - run: npm ci
      - run: npm ci --prefix services/relay
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:public
      - run: npm run check:licenses
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix services/relay --audit-level=moderate
      - run: npm test
      - run: npm run build
      - run: npx --no-install playwright install chromium
      - run: npm run test:e2e
      - run: npm run test:transport
      - run: npm run package:win
      - run: npm run test:desktop
      - run: npm run test:installer
      # No continue-on-error; only a fully successful build gets a publishable artifact.
      - name: Validate update metadata and create the checksummed artifact allowlist
        id: bundle
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: node .github/release/bundle.mjs
      - name: Store only release files from this run
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, existing CI pin
        with:
          name: stable-release-${{ steps.release.outputs.version }}-${{ github.sha }}-${{ github.run_attempt }}
          path: release-bundle/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  publish:
    name: Owner approval, artifact verification, then publish
    needs: verify-and-package
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'BardForge/bardforge' &&
      github.actor == 'ShinozakiAichi' &&
      github.triggering_actor == 'ShinozakiAichi'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
    permissions:
      contents: write
      actions: read
    steps:
      # No checkout, dependency install, or executable from the build artifact in this job.
      - name: Download the exact immutable artifact from the successful build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0, official tag resolved 2026-11-02
        with:
          artifact-ids: ${{ needs.verify-and-package.outputs.artifact_id }}
          path: release-bundle
          merge-multiple: true
      - name: Verify provenance, owner approval, hashes, tag and main; publish verified files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify-and-package.outputs.version }}
          RELEASE_COMMIT: ${{ needs.verify-and-package.outputs.commit }}
          EXPECTED_ARTIFACT_ID: ${{ needs.verify-and-package.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.verify-and-package.outputs.artifact_digest }}
          EXPECTED_SUMS_SHA256: ${{ needs.verify-and-package.outputs.sums_sha256 }}
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const owner = 'ShinozakiAichi';
          const repo = 'BardForge/bardforge';
          const version = process.env.RELEASE_VERSION;
          const sha = process.env.RELEASE_COMMIT;
          const stable = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          const digest = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const same = (actual, expected, message) => assert.deepEqual(actual, expected, message);
          const root = path.resolve('release-bundle');
          const exe = `BardForge-Studio-Setup-${version}.exe`;
          const payload = [exe, 'latest.yml', 'RELEASE_NOTES.md', 'release-manifest.json'];
          const names = [...payload, 'SHA256SUMS.txt'];
          assert.match(version, stable);
          assert.match(sha, /^[a-f0-9]{40}$/);
          same(process.env.GITHUB_EVENT_NAME, 'workflow_dispatch');
          same(process.env.GITHUB_REF, 'refs/heads/main');
          same(process.env.GITHUB_REPOSITORY, repo);
          same(process.env.GITHUB_ACTOR, owner);
          same(process.env.GITHUB_TRIGGERING_ACTOR, owner);
          same(process.env.GITHUB_SHA, sha);
          same(process.env.RELEASE_WORKFLOW_SHA, sha);
          assert.match(process.env.EXPECTED_ARTIFACT_ID, /^[1-9]\d*$/);
          assert.match(process.env.EXPECTED_SUMS_SHA256, /^[a-f0-9]{64}$/);
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          same(event.sender.login, owner);
          same(event.inputs.version, version);
          same(event.inputs.qa_commit, sha);
          same(String(event.inputs.audio_qa_passed), 'true');
          same(String(event.inputs.foundry_qa_passed), 'true');
          same(fs.readdirSync(root).sort(), [...names].sort(), 'Unexpected artifact entries');
          for (const name of names) {
            const entry = fs.lstatSync(path.join(root, name));
            assert.ok(entry.isFile() && !entry.isSymbolicLink());
            assert.ok(entry.size > 0 && entry.size < 1024 * 1024 * 1024);
          }
          const sums = fs.readFileSync(path.join(root, 'SHA256SUMS.txt'));
          same(digest(sums), process.env.EXPECTED_SUMS_SHA256, 'Checksum manifest changed in transit');
          const lines = sums.toString('utf8').trimEnd().split('\n');
          same(lines.length, payload.length);
          const expected = new Map();
          for (const [index, name] of payload.entries()) {
            const match = /^([a-f0-9]{64})  (.+)$/.exec(lines[index]);
            assert.ok(match);
            same(match[2], name, 'Unapproved checksum filename/order');
            const bytes = fs.readFileSync(path.join(root, name));
            same(digest(bytes), match[1], `Checksum mismatch: ${name}`);
            expected.set(name, { digest: `sha256:${match[1]}`, size: bytes.length });
          }
          expected.set('SHA256SUMS.txt', { digest: `sha256:${digest(sums)}`, size: sums.length });
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'release-manifest.json'), 'utf8'));
          same(manifest.schema, 1);
          same(manifest.repository, repo);
          same(manifest.version, version);
          same(manifest.commit, sha);
          same(manifest.workflowSha, sha);
          same(manifest.runId, process.env.GITHUB_RUN_ID);
          same(manifest.runAttempt, process.env.GITHUB_RUN_ATTEMPT);
          same(manifest.actor, owner);
          same(manifest.humanQa, { commit: sha, audio: true, foundryRemotePlayer: true, evidence: event.inputs.qa_notes });
          const token = process.env.GH_TOKEN;
          assert.ok(token);
          async function api(endpoint, options = {}, accepted = [200]) {
            const response = await fetch(`https://api.github.com/repos/${repo}${endpoint}`, {
              ...options,
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
              signal: AbortSignal.timeout(30000),
              redirect: 'error',
            });
            assert.ok(accepted.includes(response.status), `GitHub ${options.method ?? 'GET'} ${endpoint}: ${response.status}`);
            return { status: response.status, body: response.status === 204 ? null : await response.json() };
          }
          async function main() {
            // Missing/unprotected environment must fail before any write, even if GitHub auto-created it.
            const environment = (await api('/environments/release')).body;
            const rules = environment.protection_rules.filter((rule) => rule.type === 'required_reviewers');
            same(rules.length, 1);
            same(rules[0].prevent_self_review, false);
            same(rules[0].reviewers.map((r) => ({ type: r.type, login: r.reviewer.login })),
              [{ type: 'User', login: owner }], 'Only the owner may approve release');
            same(environment.deployment_branch_policy, { protected_branches: false, custom_branch_policies: true });
            const branches = (await api('/environments/release/deployment-branch-policies?per_page=100')).body;
            same(branches.total_count, 1);
            same(branches.branch_policies.map((p) => p.name), ['main']);
            // Older API responses omit type; the independent refs/heads/main gate remains mandatory.
            for (const policy of branches.branch_policies) if (policy.type !== undefined) same(policy.type, 'branch');
            const approvals = (await api(`/actions/runs/${process.env.GITHUB_RUN_ID}/approvals`)).body;
            assert.ok(approvals.some((r) => r.state === 'approved' && r.user.login === owner &&
              r.environments.some((e) => e.name === 'release')), 'No real owner environment approval found');
            const artifact = (await api(`/actions/artifacts/${process.env.EXPECTED_ARTIFACT_ID}`)).body;
            same(artifact.expired, false);
            same(artifact.name, `stable-release-${version}-${sha}-${process.env.GITHUB_RUN_ATTEMPT}`);
            same(String(artifact.workflow_run.id), process.env.GITHUB_RUN_ID);
            same(artifact.workflow_run.head_sha, sha);
            same(artifact.workflow_run.head_branch, 'main');
            same(artifact.digest, `sha256:${process.env.EXPECTED_ARTIFACT_DIGEST}`);
            same((await api('/git/ref/heads/main')).body.object.sha, sha, 'main moved after verification; dispatch again');
            const latest = await api('/releases/latest', {}, [200, 404]);
            if (latest.status === 200) {
              const old = latest.body.tag_name.replace(/^v/, '');
              assert.match(old, stable, 'Review an unexpected latest-release tag before continuing');
              const a = version.split('.').map(BigInt), b = old.split('.').map(BigInt);
              const firstDifference = a.findIndex((value, index) => value !== b[index]);
              assert.ok(firstDifference >= 0 && a[firstDifference] > b[firstDifference], 'Version must advance the current stable release');
            }
            const tag = `v${version}`;
            same((await api(`/git/ref/tags/${tag}`, {}, [200, 404])).status, 404, 'Refuse to replace an existing tag');
            same((await api(`/releases/tags/${tag}`, {}, [200, 404])).status, 404, 'Refuse to replace an existing release');
            // Create the required annotated tag, then reserve its ref. A racing ref fails with HTTP 422.
            const tagObject = (await api('/git/tags', { method: 'POST', body: JSON.stringify({
              tag, message: `BardForge Studio ${version}\n\nVerified commit: ${sha}\nWorkflow run: ${process.env.GITHUB_RUN_ID}\n`,
              object: sha, type: 'commit',
            }) }, [201])).body;
            assert.match(tagObject.sha, /^[a-f0-9]{40}$/);
            same(tagObject.tag, tag);
            same(tagObject.object.type, 'commit');
            same(tagObject.object.sha, sha);
            await api('/git/refs', { method: 'POST', body: JSON.stringify({
              ref: `refs/tags/${tag}`, sha: tagObject.sha,
            }) }, [201]);
            const notes = fs.readFileSync(path.join(root, 'RELEASE_NOTES.md'), 'utf8');
            const release = (await api('/releases', { method: 'POST', body: JSON.stringify({
              tag_name: tag, target_commitish: sha, name: `BardForge Studio ${version}`,
              body: notes, draft: true, prerelease: false, make_latest: 'false',
            }) }, [201])).body;
            console.log(`Created draft ${release.id}; failures leave it unpublished for owner inspection.`);
            for (const name of names) {
              const bytes = fs.readFileSync(path.join(root, name));
              same(digest(bytes), expected.get(name).digest.slice(7), 'File changed before upload');
              const response = await fetch(`https://uploads.github.com/repos/${repo}/releases/${release.id}/assets?name=${encodeURIComponent(name)}`, {
                method: 'POST', headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/octet-stream', 'Content-Length': String(bytes.length) },
                body: bytes, signal: AbortSignal.timeout(300000), redirect: 'error',
              });
              same(response.status, 201, `Upload failed: ${name}`);
              const uploaded = await response.json();
              same(uploaded.digest, expected.get(name).digest, `GitHub asset digest mismatch: ${name}`);
              same(uploaded.size, expected.get(name).size);
            }
            const assets = (await api(`/releases/${release.id}/assets?per_page=100`)).body;
            same(assets.map((a) => a.name).sort(), [...names].sort());
            for (const asset of assets) {
              same(asset.state, 'uploaded');
              same(asset.digest, expected.get(asset.name).digest);
              same(asset.size, expected.get(asset.name).size);
            }
            const tagRef = (await api(`/git/ref/tags/${tag}`)).body.object;
            same(tagRef.type, 'tag');
            same(tagRef.sha, tagObject.sha);
            const annotated = (await api(`/git/tags/${tagRef.sha}`)).body;
            same(annotated.tag, tag);
            same(annotated.object.type, 'commit');
            same(annotated.object.sha, sha, 'Annotated tag no longer resolves to the verified commit');
            same((await api('/git/ref/heads/main')).body.object.sha, sha, 'main moved during upload; draft retained');
            const published = (await api(`/releases/${release.id}`, { method: 'PATCH', body: JSON.stringify({
              draft: false, prerelease: false, make_latest: 'true',
            }) })).body;
            same(published.draft, false);
            same(published.prerelease, false);
            console.log(`Published ${published.html_url} from ${sha}`);
          }
          main().catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE
