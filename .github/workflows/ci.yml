name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, 'feature/**', 'fix/**', 'chore/**', 'test/**', 'refactor/**', 'docs/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            command: npm run lint && npm run format:check
          - name: typecheck
            command: npm run typecheck
          - name: unit-tests
            command: npm test
          - name: build
            command: npm run build
          - name: dependency-audit
            command: npm audit --audit-level=moderate && npm run check:licenses
          - name: secret-scan
            command: npm run check:public -- --secrets-only
          - name: repository-hygiene
            command: npm run check:public -- --paths-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}

  integration:
    name: windows-audio-integration
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run package:win
      - run: npm run test:desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ui-verification
          path: |
            tmp/ui-desktop.png
            tmp/ui-mobile.png
            tmp/desktop-packaged.png
            test-results/
          retention-days: 7
